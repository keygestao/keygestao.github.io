header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);z-index:2}
header img{width:46px;height:46px;border-radius:50%;object-fit:cover;flex:none}
header .n{font-weight:700;font-size:17px;line-height:1.2}
header .s{font-size:13px;color:var(--mut);display:flex;align-items:center;gap:6px}
header .s i{width:8px;height:8px;border-radius:50%;background:#5BB974;display:inline-block}
header .k{margin-left:auto;font-size:12px;letter-spacing:.18em;font-weight:700;color:var(--ac)}
#chat{flex:1;overflow-y:auto;padding-block:18px 8px;padding-inline:16px;display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:88%;animation:in .25s ease-out}
.msg img{width:28px;height:28px;border-radius:50%;object-fit:cover;flex:none}
.b{background:var(--panel);padding:10px 14px;border-radius:16px 16px 16px 4px;min-width:0}
.eu{align-self:flex-end}
.eu .b{background:var(--ac);color:var(--ac-ink);font-weight:500;border-radius:16px 16px 4px 16px}
.dots{display:flex;gap:4px;padding:14px}
.dots span{width:6px;height:6px;border-radius:50%;background:var(--mut);animation:d 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
#opts{padding:10px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;min-height:64px}
#opts button{font:500 15px var(--f);color:var(--fg);background:transparent;border:1.5px solid var(--ac);border-radius:999px;padding:10px 16px;cursor:pointer}
#opts button:hover,#opts button:focus-visible{background:var(--ac);color:var(--ac-ink);outline:none}
#opts form{display:flex;gap:8px;width:100%}
#opts input{flex:1;min-width:0;font:400 16px var(--f);color:var(--fg);background:var(--panel);border:1.5px solid var(--line);border-radius:999px;padding:10px 16px}
#opts input:focus{outline:none;border-color:var(--ac)}
.cta{display:block;text-align:center;text-decoration:none;font:700 16px var(--f);background:var(--ac);color:var(--ac-ink);border-radius:999px;padding:14px 18px;width:100%}
.nota{font-size:12px;color:var(--mut);text-align:center;width:100%}
@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes d{0%,60%,100%{opacity:.3}30%{opacity:1}}
@media (prefers-reduced-motion:reduce){.msg,.dots span{animation:none}}
</style>
</head>

    <div><div class="n">Henrique Dornelas</div><div class="s"><i></i>online</div></div>
    <div class="k">KEY</div>
  </header>
  <div id="chat" aria-live="polite"></div>
  <div id="opts"></div>
</div>

<script>
const AV = document.querySelector("header img").src;
const WHATS = "5531999106115";
const chat = document.getElementById("chat"), opts = document.getElementById("opts");
const r = {};
const wait = ms => new Promise(f => setTimeout(f, ms));

function bolha(txt, eu) {
  const m = document.createElement("div"); m.className = "msg" + (eu ? " eu" : "");
  if (!eu) { const i = document.createElement("img"); i.src = AV; i.alt = ""; m.appendChild(i); }
  const b = document.createElement("div"); b.className = "b"; b.textContent = txt; m.appendChild(b);
  chat.appendChild(m); chat.scrollTop = chat.scrollHeight; return m;
}
async function fala(txt) {
  const m = document.createElement("div"); m.className = "msg";
  m.innerHTML = '<img alt=""><div class="b dots"><span></span><span></span><span></span></div>';
  m.querySelector("img").src = AV; chat.appendChild(m); chat.scrollTop = chat.scrollHeight;
  await wait(Math.min(1400, 450 + txt.length * 14)); m.remove(); bolha(txt);
}
function escolha(lista) {
  return new Promise(ok => {
    opts.innerHTML = "";
    lista.forEach(t => {
      const b = document.createElement("button"); b.type = "button"; b.textContent = t;
      b.onclick = () => { opts.innerHTML = ""; bolha(t, true); ok(t); };
      opts.appendChild(b);
    });
  });
}
function texto(ph, id) {
  return new Promise(ok => {
    opts.innerHTML = `<form><input id="${id}" autocomplete="given-name" placeholder="${ph}" required><button type="submit">Enviar</button></form>`;
    const f = opts.querySelector("form"); const i = f.querySelector("input"); i.focus();
    f.onsubmit = e => { e.preventDefault(); const v = i.value.trim(); if (!v) return; opts.innerHTML = ""; bolha(v, true); ok(v); };
  });
}

async function fluxo() {
  await fala("Opa, Henrique aqui, da KEY Gestão. Vou te atender pessoalmente, mas antes responde aqui até o final. Leva menos de 1 minuto.");
  await fala("Qual é o seu objetivo?");
  r.objetivo = await escolha(["Ter renda de aluguel", "Comprar para morar", "Os dois"]);
  await fala("Onde você mora hoje?");
  r.mora = await escolha(["No Brasil", "Fora do Brasil"]);
  await fala("Quando você olha para a sua idade e para o que já construiu, como se sente?");
  r.sente = await escolha(["Queria estar mais à frente", "Estou bem, mas quero acelerar", "Já cheguei onde queria"]);
  await fala("Quanto você conseguiria separar por mês?");
  r.mes = await escolha(["Até R$ 2.500", "De R$ 2.500 a R$ 5.000", "Acima de R$ 5.000"]);
  await fala("Você tem algum capital guardado hoje?");
  r.capital = await escolha(["Não", "Até R$ 50 mil", "Acima de R$ 50 mil"]);
  await fala("Pra fechar: como é o seu nome?");
  r.nome = await texto("Seu nome", "nome");
  await fala(`Perfeito, ${r.nome}. Com isso eu já preparo o seu Diagnóstico Patrimonial: 30 minutos, sem custo, e um plano por escrito no final.`);
  await fala("Toca no botão abaixo pra me chamar no WhatsApp. Suas respostas já vão junto.");
  const msg = `Oi, Henrique! Sou ${r.nome} e respondi o Diagnóstico KEY.\n\nObjetivo: ${r.objetivo}\nMoro: ${r.mora}\nComo me sinto: ${r.sente}\nPor mês: ${r.mes}\nCapital guardado: ${r.capital}\n\nQuero agendar meu Diagnóstico Patrimonial.`;
  opts.innerHTML = `<a class="cta" target="_blank" rel="noopener" href="https://wa.me/${WHATS}?text=${encodeURIComponent(msg)}">Falar com o Henrique no WhatsApp</a><div class="nota">Se não abrir, chama no (31) 99910-6115</div>`;
}
fluxo();
</script>
